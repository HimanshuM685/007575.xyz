<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Map 1.0</title>
  <meta name="description" content="A SunView-style sitemap of projects hosted on 007575.xyz subdomains." />
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===================== DESKTOP ===================== -->
  <div class="desktop" id="desktop">

    <!-- ----- a couple of background "desktop icons" for flavor ----- -->
    <div class="deskicon" style="top:22px;left:22px;">
      <div class="deskicon-box">[]</div>
      <span class="deskicon-label">Console</span>
    </div>
    <div class="deskicon" style="top:22px;left:104px;">
      <div class="deskicon-box">DIR</div>
      <span class="deskicon-label">files</span>
    </div>

    <!-- ===================== MAIN WINDOW ===================== -->
    <div class="window" id="mainWindow">
      <!-- title bar -->
      <div class="titlebar">
        <span class="title-text">Site Map 1.0</span>
        <span class="title-buttons">
          <button class="title-btn" id="invertBtn" type="button" title="Invert video">inv</button>
          <span class="title-btn title-btn-static">[]</span>
          <span class="title-btn title-btn-static">X</span>
        </span>
      </div>

      <!-- menu bar -->
      <div class="menubar">
        <span class="menu-item">File</span>
        <span class="menu-item">View</span>
        <span class="menu-item">Sort</span>
        <span class="menu-item">Help</span>
      </div>

      <!-- content -->
      <div class="content">
        <p class="banner">PROJECTS HOSTED ON *.007575.xyz &mdash; SELECT A DESTINATION</p>

        <!-- toolbar: search + filters -->
        <div class="toolbar">
          <div class="field">
            <label for="search">Search:</label>
            <input type="text" id="search" autocomplete="off" spellcheck="false" />
            <span class="caret" id="caret">_</span>
          </div>
          <div class="filters" id="filters"></div>
        </div>

        <div class="rule"></div>

        <!-- icon grid -->
        <div class="grid" id="grid" aria-live="polite"></div>
        <p class="empty" id="empty" hidden>** No matching items **</p>
      </div>

      <!-- status bar -->
      <div class="statusbar">
        <span id="statusLeft">0 items</span>
        <span id="statusRight">--More--</span>
      </div>
    </div>

    <!-- ===================== ABOUT / FOOTER WINDOW ===================== -->
    <div class="window window-small" id="aboutWindow">
      <div class="titlebar">
        <span class="title-text">readme</span>
      </div>
      <div class="content content-tight">
        <p>&copy; <span id="year"></span> 007575.xyz</p>
        <p class="dim">static / no tracking / html+css+js</p>
        <p class="dim">press &nbsp;<span class="kbd">/</span>&nbsp; to search</p>
      </div>
    </div>

  </div>

  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
